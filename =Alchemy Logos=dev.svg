<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="alchemyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9600ff" />
      <stop offset="100%" stop-color="#0003ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Flask Body -->
  <path d="M42 20 L42 38 L25 72 C22 78 26 84 34 84 L66 84 C74 84 78 78 75 72 L58 38 L58 20 Z" 
        fill="url(#alchemyGrad)" opacity="0.2" stroke="url(#alchemyGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Top Rim -->
  <rect x="38" y="16" width="24" height="6" rx="3" fill="#9600ff" />
  <!-- Liquid / Bubbles inside -->
  <path d="M30 65 Q50 55 70 65 L66 82 L34 82 Z" fill="url(#alchemyGrad)" opacity="0.8" />
  <circle cx="45" cy="70" r="3" fill="#fff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="55" cy="62" r="2" fill="#fff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#9600ff" opacity="0.9"/>
  <!-- Code symbol overlay -->
  <path d="M43 45 L37 51 L43 57" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 45 L63 51 L57 57" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
